name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # From the lock, not from pyproject, so the tree CI tests is the tree the
      # dependency graph scans. --locked rather than --frozen: both install from
      # the lock but only --locked fails when it no longer matches pyproject,
      # which replaces the separate `uv lock --check` step this had.
      - run: |
          pip install --quiet uv
          uv sync --locked --extra dev
      # .ruff_cache was committed to the tree, so ruff was already part of the
      # hand workflow and only CI did not run it. Fifteen errors had accumulated
      # across six files, including a duplicate `import json` and a logger
      # assignment sitting between the third-party and local import blocks.
      - name: Lint
        run: uv run --frozen ruff check --select F,E4,E7,E9 src/ tests/ eval/

      - run: uv run --frozen python -m pytest -v --tb=short -m "not integration"


      - name: Trajectory eval
        # Needs no API keys and costs nothing, because it replays the recorded
        # transport, so unlike eval/eval.py it can gate every commit. Exits 1
        # if any of the three addresses takes a path the data does not justify.
        run: uv run --frozen python -m eval.trajectory

      - name: README test count matches what pytest collects
        run: |
          n=$(uv run --frozen python -m pytest --collect-only -q -m "not integration" | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          [ -n "$n" ] || { echo "could not parse a count out of pytest"; exit 1; }
          fail=0
          grep -q "tests-$n-brightgreen" README.md || { echo "badge does not say $n"; fail=1; }
          grep -q "$n tests (pytest + respx)" README.md || { echo "overview line does not say $n"; fail=1; }
          grep -q "^All $n tests run without any API keys" README.md || { echo "testing section does not say $n"; fail=1; }
          [ "$fail" = 0 ] || { echo "pytest collects $n. Update all three spots in README.md."; exit 1; }
          echo "README agrees with pytest: $n"
