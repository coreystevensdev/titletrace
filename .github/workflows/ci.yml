name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -v --tb=short -m "not integration"

      - name: uv.lock still matches pyproject.toml
        # The lock is not what installs anything here; pip does, from
        # pyproject.toml. It exists so GitHub's dependency graph sees the whole
        # transitive tree instead of only the declared deps, which is the
        # difference between 62 packages scanned and 17. A lock nothing enforces
        # drifts, and a drifted lock makes the scan precise and wrong, so this
        # step fails if the two disagree. Exits 1 on drift, verified by adding a
        # dependency to pyproject and watching it fail.
        run: |
          pip install --quiet uv
          uv lock --check

      - name: Trajectory eval
        # Needs no API keys and costs nothing, because it replays the recorded
        # transport, so unlike eval/eval.py it can gate every commit. Exits 1
        # if any of the three addresses takes a path the data does not justify.
        run: python -m eval.trajectory

      - name: README test count matches what pytest collects
        run: |
          n=$(python -m pytest --collect-only -q -m "not integration" | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          [ -n "$n" ] || { echo "could not parse a count out of pytest"; exit 1; }
          fail=0
          grep -q "tests-$n-brightgreen" README.md || { echo "badge does not say $n"; fail=1; }
          grep -q "$n tests (pytest + respx)" README.md || { echo "overview line does not say $n"; fail=1; }
          grep -q "^All $n tests run without any API keys" README.md || { echo "testing section does not say $n"; fail=1; }
          [ "$fail" = 0 ] || { echo "pytest collects $n. Update all three spots in README.md."; exit 1; }
          echo "README agrees with pytest: $n"
