name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -v --tb=short -m "not integration"

      - name: README test count matches what pytest collects
        run: |
          n=$(python -m pytest --collect-only -q -m "not integration" | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          [ -n "$n" ] || { echo "could not parse a count out of pytest"; exit 1; }
          fail=0
          grep -q "tests-$n-brightgreen" README.md || { echo "badge does not say $n"; fail=1; }
          grep -q "$n tests (pytest + respx)" README.md || { echo "overview line does not say $n"; fail=1; }
          grep -q "^All $n tests run without any API keys" README.md || { echo "testing section does not say $n"; fail=1; }
          [ "$fail" = 0 ] || { echo "pytest collects $n. Update all three spots in README.md."; exit 1; }
          echo "README agrees with pytest: $n"
