[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titletrace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.10,<2",
    "langsmith>=0.2",
    "anthropic>=0.90,<2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.28",
    "rolling-cost-cap>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx"]

[tool.hatch.build.targets.wheel]
packages = ["src/titletrace"]

[tool.pytest.ini_options]
# eval/ is tooling, not library code, so it is deliberately outside the wheel
# that [tool.hatch.build.targets.wheel] builds. tests/test_trajectory_eval.py
# still imports eval.trajectory, which worked only because `pip install -e .`
# leaves the repo root on sys.path. Under an isolated venv it does not, so
# `uv run pytest` failed collection with ModuleNotFoundError: No module named
# 'eval'. Stating the path here makes the import work under either installer
# without shipping eval/ to anyone.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires live API keys (skipped in CI unless INTEGRATION=true)"]
